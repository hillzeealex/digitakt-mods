name: release
# Pousser un tag vX.Y publie une release avec un .zip par recette et un .zip de tous les mods par OS,
# à télécharger sans rien connaître à git.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sync.py --verify
      - name: Packs
        run: |
          mkdir packs
          for r in recipes/*/*.txt; do
            grep -vE '^\s*(#|$)' "$r" | zip -j -q "packs/pack-$(basename "$r" .txt).zip" -@
          done
          zip -j -q packs/tous-les-mods-mk1-1.54.zip elemods/digitakt-mk1/1.54/*.elemod
          zip -j -q packs/tous-les-mods-mk1-1.53.zip elemods/digitakt-mk1/1.53/*.elemod
          zip -j -q packs/tous-les-mods-dt2-1.17.zip elemods/digitakt-ii/1.17/*.elemod
      - name: Code source des mods GPL (GPL-2.0, section 3a)
        run: |
          mkdir sources
          python3 -c "import json;[print(m.get('built_from', m['source'])) for m in json.load(open('mods.json'))['mods'] if m['license'].startswith('GPL')]" | sort -u |
          while IFS=@ read -r repo ref; do
            gh api "repos/$repo/tarball/$ref" > "sources/source-${repo//\//-}-$ref.tar.gz"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          files="packs/*.zip elemods/*/*/*.elemod sources/*.tar.gz"
          gh release create "$GITHUB_REF_NAME" $files --title "$GITHUB_REF_NAME" --generate-notes ||
            gh release upload "$GITHUB_REF_NAME" $files --clobber
        env:
          GH_TOKEN: ${{ github.token }}
