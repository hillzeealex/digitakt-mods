<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Les 4 étapes : télécharger, construire sur elekloader, envoyer avec Transfer, jouer</title>
<style>
.c{fill:#1b1808}.y{fill:#ffe23a}.k{fill:#1b1808}
.l{stroke:#ffe23a;fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.t{fill:#ffe23a;font-size:25px;font-weight:700}.s{fill:#eee8c4;font-size:16px}
.a{stroke:#999;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
</style>
<rect class="c" x="0" y="0" width="220" height="290" rx="18"/>
<rect class="c" x="260" y="0" width="220" height="290" rx="18"/>
<rect class="c" x="520" y="0" width="220" height="290" rx="18"/>
<rect class="c" x="780" y="0" width="220" height="290" rx="18"/>
<path class="a" d="M230 105h20m-8-8 8 8-8 8M490 105h20m-8-8 8 8-8 8M750 105h20m-8-8 8 8-8 8"/>
<!-- 1 : deux fichiers -->
<path class="l" d="M30 40h50l18 18v80H30z M80 40v18h18"/>
<text class="y m" x="44" y="112" font-size="20">OS</text>
<path class="l" d="M120 40h50l18 18v80h-68z M170 40v18h18"/>
<text class="y m" x="126" y="112" font-size="17">MODS</text>
<text class="t" x="20" y="200">1. Télécharge</text>
<text class="s" x="20" y="232">l'OS officiel Elektron</text>
<text class="s" x="20" y="256">+ un pack de mods</text>
<!-- 2 : navigateur -->
<rect class="l" x="285" y="36" width="170" height="110" rx="10"/>
<path class="l" d="M285 60h170"/>
<circle class="y" cx="300" cy="48" r="4"/><circle class="y" cx="314" cy="48" r="4"/><circle class="y" cx="328" cy="48" r="4"/>
<text class="y m" x="300" y="88" font-size="16">elekloader</text>
<rect class="y" x="320" y="104" width="100" height="30" rx="7"/>
<text class="k" x="343" y="125" font-size="17" font-weight="700">Build</text>
<text class="t" x="280" y="200">2. Construis</text>
<text class="s" x="280" y="232">dépose-les sur la page</text>
<text class="s" x="280" y="256">elekloader, puis Build</text>
<!-- 3 : ordinateur + câble -->
<rect class="l" x="545" y="40" width="100" height="66" rx="6"/>
<path class="l" d="M532 120h126"/>
<text class="y m" x="555" y="80" font-size="13">Transfer</text>
<path class="l" d="M658 112c22 0 22-40 44-40"/>
<rect class="l" x="700" y="58" width="22" height="28" rx="4"/>
<text class="y m" x="563" y="100" font-size="12">.syx</text>
<text class="t" x="540" y="200">3. Envoie</text>
<text class="s" x="540" y="232">le fichier .syx avec</text>
<text class="s" x="540" y="256">Elektron Transfer (USB)</text>
<!-- 4 : la Digitakt -->
<rect class="l" x="798" y="34" width="184" height="114" rx="10"/>
<rect x="812" y="48" width="86" height="44" rx="3" fill="#000" stroke="#ffe23a" stroke-width="2"/>
<text class="y m" x="818" y="66" font-size="10">DIGISLICER</text>
<text class="y m" x="818" y="83" font-size="10">MONO SAW</text>
<g class="l" style="stroke-width:3"><circle cx="918" cy="58" r="8"/><circle cx="944" cy="58" r="8"/><circle cx="968" cy="58" r="8"/><circle cx="918" cy="84" r="8"/><circle cx="944" cy="84" r="8"/><circle cx="968" cy="84" r="8"/></g>
<g class="y"><rect x="812" y="114" width="14" height="18" rx="3"/><rect x="833" y="114" width="14" height="18" rx="3"/><rect x="854" y="114" width="14" height="18" rx="3"/><rect x="875" y="114" width="14" height="18" rx="3"/><rect x="896" y="114" width="14" height="18" rx="3"/><rect x="917" y="114" width="14" height="18" rx="3"/><rect x="938" y="114" width="14" height="18" rx="3"/><rect x="959" y="114" width="14" height="18" rx="3"/></g>
<text class="t" x="800" y="200">4. Joue</text>
<text class="s" x="800" y="232">appuie sur YES sur la</text>
<text class="s" x="800" y="256">machine, c'est installé</text>
</svg>
